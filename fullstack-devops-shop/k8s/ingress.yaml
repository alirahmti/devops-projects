apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-shop-ingress
  namespace: devops-shop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: devops-shop.local   # change to your real domain / MetalLB-assigned host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3000
