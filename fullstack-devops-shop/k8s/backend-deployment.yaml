apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-shop
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # imagePullSecrets is required if your GitLab Container Registry project is private.
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: backend
          # Replaced by the CI/CD pipeline (see .gitlab-ci.yml, deploy stage) with:
          # ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}
          image: ${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: devops-shop-config
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
