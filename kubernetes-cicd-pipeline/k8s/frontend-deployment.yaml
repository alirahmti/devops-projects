apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-shop
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: frontend
          # Replaced by the CI/CD pipeline with:
          # ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHORT_SHA}
          image: ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHORT_SHA}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
