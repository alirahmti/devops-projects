server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend Service inside the cluster.
    # BACKEND_SERVICE is templated at container start (see docker-entrypoint patch below),
    # defaults to the in-cluster Service name/port used in k8s/backend-service.yaml.
    location /api/ {
        proxy_pass http://backend-service:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
